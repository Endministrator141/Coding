<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DiKantin Polije</title>
</head>
<body>

    <main>
        <!-- Bagian Branding / Info -->
        <section>
            <div>
                <!-- Tempat Logo -->
                <img src="assets/images/logo-dikantin.png" alt="Logo DiKantin Polije">
                <h1>Dikantin Polije</h1>
                <p>SOLUSI CEPAT KETIKA LAPAR</p>
            </div>
        </section>

        <!-- Bagian Formulir Login -->
        <section>
            <h2>Selamat Datang!</h2>
            <p>Masuk untuk mulai memesan makanan.</p>

            <form action="dashboard.html" method="get">
                <div>
                    <label for="username">Email atau NIM</label><br>
                    <input type="text" id="username" name="username" required>
                </div>
                <br>
                <div>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </div>
                <br>
                <button type="submit">Masuk</button>
            </form>

            <p>Belum punya akun? <a href="#">Daftar di sini</a></p>
        </section>
    </main>

</body>
</html>
